[workspace]

[package]
name = "quay-aggregator-jupiter"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Jupiter `Amm` adapter for the Quay program. Plug-in for routers using `jupiter-amm-interface 0.6`."

[lib]
path = "src/lib.rs"

[dependencies]
# `quay-sdk` is the off-chain SDK (instruction builders, PDAs, zero-copy
# decoders, swap simulator). It pulls the pricing VM (`quay-vm`) in turn.
quay-sdk = "0.0.5"

jupiter-amm-interface = "=0.6.1"

# `solana-program` must match the one re-exported by quay-sdk, otherwise
# the `Pubkey` / `AccountMeta` types diverge across the crate boundary.
solana-program = "2.1"

# jupiter-amm-interface 0.6.1 declares its modular Solana deps as `>=2`
# with no upper bound, so a fresh resolve floats them to 3.x/4.x while
# `solana-program = "2.1"` keeps our side at 2.x — two majors of the same
# types, which doesn't compile. Declaring them directly with 2.x caps
# forces the whole graph onto one 2.x line. Drop these once upstream
# bounds its ranges.
solana-account = "2"
solana-account-decoder = "2"
solana-clock = "2"
solana-instruction = "2"
solana-pubkey = "2"

anyhow = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
exit = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
result_large_err = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"

[dev-dependencies]
# Parity tests (`tests/parity.rs`) decode the litesvm-generated fixtures.
solana-sdk = "2.2"
serde_json = "1"
base64 = "0.22"
